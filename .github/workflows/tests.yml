# The same checks the tool runs upstream: Python data-job tests, catalog validation, calibration freshness, the
# TypeScript engine tests, the import boundary, and a production build.
name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/llm-sizer/requirements-dev.txt
      - run: pip install -r scripts/llm-sizer/requirements-dev.txt
      - run: python -m pytest scripts/llm-sizer/tests -q
      - run: python scripts/llm-sizer/validate_machines.py
      - run: python scripts/llm-sizer/calibrate.py --check

  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx vitest run
      - run: bash scripts/llm-sizer/check-boundary.sh
      - run: npm run build
